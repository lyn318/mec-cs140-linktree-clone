<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>
      Social Media Linktree
  </title>

  <!-- Favicon: you can add image link in the href attribute and it will show up on the tab -->
  <link rel="icon" href="social_media.jpg.webp" type="image/x-icon" />


  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <a id="profilePicture" href="#popup>
      <img src="social_media" alt="">
  </a>


  <p id="userName">
    Doomscroll Central
  </p>

  <div id="links">
    <a class="link" href="https://www.roblox.com/" target="_blank">
      Roblox
    </a>
        <a class="link" href="https://www.netflix.com/" target="_blank">
      Netflix
    </a>
    <!-- Add 2 more links! -->
     <a class="link" href="https://www.instagram.com/?hl=en" target="_blank">
      Instagram
    </a>
    <a class="link" href="https://www.tiktok.com/foryou?lang=en" target="_blank">
      TikTok
    </a>
  </div>

  <div id="hashtag">
    #HaveFun!
  </div>
</body>

</html>
